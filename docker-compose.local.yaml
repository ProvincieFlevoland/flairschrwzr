# docker-compose.local.yaml
# Local GovChat stack: Open WebUI, admin overlay, backend, blob emulator and fixtures.
#
#   docker compose -f docker-compose.local.yaml up --build
#
# Open WebUI: http://localhost:3000   (first visit creates the local admin account)
# Admin panel: http://localhost:3002  (password: see ADMIN_PASSWORD below)
#
# Backend: http://localhost:8011.
# Recorded AI by default; see docs/LOCAL-DEVELOPMENT.md for LiteLLM settings.
# The old host-backend route remains available:
#   1. bash schrijfassistent/dev/run-local-dev.sh
#   2. docker compose -f docker-compose.local.yaml up --build open-webui govchat-admin
#      Stop an existing container backend first to free port 8011.
#   3. sign in at http://localhost:3000 with an Open WebUI account (use a non-admin account for the dashboard; an admin sees
#      the "Als auteur werken" control); the card opens the embedded app for every signed-in user
#   4. http://localhost:3000 -> App Launcher -> Schrijfassistent: the dashboard loads the nota list from :8011
# The two SCHRIJFASSISTENT_* variables below are what lets the loader accept the http://localhost API URL. They
# exist only in this file: the admin server publishes `allow_local_api` only when the variable is set, and
# loader.js honours it only when the page itself is served from localhost, so the https-only rule
# holds on every real host. The pipeline and the Terraform App Settings never set them.
#
# Start order matters: Open WebUI overwrites /static/loader.js on every start, and
# the admin container republishes the overlay 15 seconds after its own start. The
# depends_on below starts the admin container after Open WebUI. If the overlay is
# missing after a restart of Open WebUI alone, restart the admin container too:
#   docker compose -f docker-compose.local.yaml restart govchat-admin

services:
  # Builds the production recipe locally; the helper exits without starting
  # an API server. Its image is used by the dev build through additional_contexts.
  schrijfassistent-backend-base:
    build:
      context: schrijfassistent/backend
    command: ["python", "-c", "pass"]
    network_mode: none
    read_only: true
    healthcheck:
      disable: true

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.8.10   # pin the tag that flair-dev runs
    ports:
      - "3000:8080"
    environment:
      STATIC_DIR: /app/backend/static      # required so the overlay files are served from /static
      WEBUI_NAME: GovChat lokaal
      CORS_ALLOW_ORIGIN: http://localhost:3000
    volumes:
      - govchat-static:/app/backend/static
      - open-webui-data:/app/backend/data

  govchat-admin:
    build:
      # repository root: admin/Dockerfile is multi-stage and builds schrijfassistent/frontend first
      # (see schrijfassistent/README.md); the bundle ships inside the image, no extra volume
      context: .
      dockerfile: admin/Dockerfile
    ports:
      - "3002:3002"
    environment:
      ADMIN_PASSWORD: lokaal123           # server.js reads ADMIN_PASSWORD (the README's GOVCHAT_ADMIN_PASSWORD is a doc error)
      DATA_DIR: /data
      PUBLISH_DIR: /publish
      CORS_ORIGIN: http://localhost:3000
      SCHRIJFASSISTENT_ALLOW_LOCAL_API: "1"                          # local development only, see the header of this file
      SCHRIJFASSISTENT_LOCAL_API_BASE_URL: http://localhost:8011
    volumes:
      - govchat-admin-data:/data
      - govchat-static:/publish            # same volume as Open WebUI's STATIC_DIR
    depends_on:
      - open-webui

  schrijfassistent-blobstorage-emulator:
    image: schrijfassistent-api-dev:local
    pull_policy: never
    command: ["python", "/opt/dev/blobemu.py", "--host", "0.0.0.0", "--port", "10000", "--data-dir", "/data"]
    environment:
      AI_MOCK: "0"
    volumes:
      - schrijfassistent-blob-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 10000), timeout=3).close()"]
      interval: 2s
      timeout: 4s
      retries: 30
      start_period: 5s

  schrijfassistent-backend:
    image: schrijfassistent-api-dev:local
    pull_policy: never
    build:
      context: .
      dockerfile: schrijfassistent/dev/Dockerfile.backend
      args:
        BACKEND_IMAGE: backend-base
      additional_contexts:
        backend-base: ${SCHRIJFASSISTENT_BACKEND_IMAGE:-service:schrijfassistent-backend-base}
    ports:
      - "127.0.0.1:8011:8000"
    env_file:
      - path: ./schrijfassistent/backend/.env
        required: false
    environment:
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSrZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://schrijfassistent-blobstorage-emulator:10000/devstoreaccount1;"
      AZURE_STORAGE_CONTAINER_NAME: govchat-docs
      OPENWEBUI_INTERNAL_URL: http://open-webui:8080
      CORS_ALLOW_ORIGINS: http://localhost:3000
      AI_MOCK: ${SCHRIJFASSISTENT_AI_MOCK:-1}
      AI_PROVIDER: litellm
      LITELLM_URL: ${SCHRIJFASSISTENT_LITELLM_URL:-}
      LITELLM_API_KEY: ${SCHRIJFASSISTENT_LITELLM_API_KEY:-}
      AI_MODEL: ${SCHRIJFASSISTENT_AI_MODEL:-}
    volumes:
      - schrijfassistent-mock-logs:/logs
    depends_on:
      open-webui:
        condition: service_started
      schrijfassistent-blobstorage-emulator:
        condition: service_healthy

volumes:
  govchat-static:
  govchat-admin-data:
  open-webui-data:
  schrijfassistent-blob-data:
  schrijfassistent-mock-logs:
