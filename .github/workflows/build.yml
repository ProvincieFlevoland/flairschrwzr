name: Container images

# Release flow: one immutable image per version tag.
#
#   pull_request -> main   build + scan only; no registry login, no push, no secrets
#   push tag vX.Y.Z        verify tag, build once, push to ghcr.io with tag vX.Y.Z
#                          (+ latest when it is the highest released version)
#
# Images: ghcr.io/<owner>/<repo>-<name>:vX.Y.Z
# Promotion to the Azure Container Registry happens afterwards from this exact image
# (by digest); it is never rebuilt per environment.

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------------------
  # Pull requests (including forks): build and scan, nothing is published.
  # ---------------------------------------------------------------------------------------
  pr-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin
            context: ./admin
            dockerfile: ./admin/Dockerfile
          # Add further images here, e.g. once the schrijfassistent backend is on main:
          # - name: schrijfassistent-api
          #   context: ./schrijfassistent/backend
          #   dockerfile: ./schrijfassistent/backend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: pr-${{ matrix.name }}:${{ github.event.pull_request.number }}

      - name: Trivy scan (fail on fixable CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2 image --exit-code 1 --severity CRITICAL --ignore-unfixed \
            "pr-${{ matrix.name }}:${{ github.event.pull_request.number }}"

  # ---------------------------------------------------------------------------------------
  # Version tags: guard rails before anything is built.
  # ---------------------------------------------------------------------------------------
  verify-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag format, branch and latest
        id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points to a commit that is not on main"
            exit 1
          fi
          HIGHEST=$(git tag -l 'v*.*.*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          LATEST=false
          [ "$TAG" = "$HIGHEST" ] && LATEST=true
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Release $TAG (latest: $LATEST)"

  # ---------------------------------------------------------------------------------------
  # Version tags: build once and publish to ghcr.io.
  # ---------------------------------------------------------------------------------------
  release:
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin
            context: ./admin
            dockerfile: ./admin/Dockerfile
          # Keep in sync with the pr-build matrix above.
          # - name: schrijfassistent-api
          #   context: ./schrijfassistent/backend
          #   dockerfile: ./schrijfassistent/backend/Dockerfile
    env:
      VERSION: ${{ needs.verify-tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing version
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists; versions are built only once. Create a new tag instead."
            exit 1
          fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ needs.verify-tag.outputs.latest == 'true' }}

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            GIT_COMMIT=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }} ${VERSION}"
            echo ""
            echo "- Image: \`${IMAGE}:${VERSION}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
