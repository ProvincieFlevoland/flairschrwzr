name: Container images

# Release flow: one immutable image per version tag.
#
#   pull_request -> main   build + scan only; no registry login, no push, no secrets
#   manual run on a branch same as a pull request (Actions -> Run workflow)
#   push tag vX.Y.Z        verify tag, build once, push to ghcr.io with tag vX.Y.Z
#                          (+ latest when it is the highest released version)
#                          then notify Azure DevOps (job notify-ado): roll out vX.Y.Z to dev
#   push tag acc/vX.Y.Z    no build: check that vX.Y.Z exists (same commit, all images on ghcr.io),
#                          then notify Azure DevOps: roll out vX.Y.Z to acc
#   push tag prod/vX.Y.Z   same, to prod; additionally requires acc/vX.Y.Z to exist
#
# The payload to Azure DevOps is {"tag":"vX.Y.Z","version":"X.Y.Z","environment":"dev|acc|prod"}.
# Promotion never rebuilds: acc and prod get the exact images that ran on dev.
#
# Images: ghcr.io/<owner>/<repo>-<name>:vX.Y.Z, one per matrix entry, all with the same tag:
#   ghcr.io/provincieflevoland/flairschrwzr-admin                  (admin + Schrijfassistent frontend)
#   ghcr.io/provincieflevoland/flairschrwzr-schrijfassistent-api   (Schrijfassistent backend)
# Azure DevOps rolls out these exact images straight from ghcr.io (no ACR); an image is never
# rebuilt per environment.

on:
  push:
    tags:
      - 'v*.*.*'         # build + dev
      - 'acc/v*.*.*'     # promote to acc
      - 'prod/v*.*.*'    # promote to prod
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------------------
  # Pull requests (including forks) and manual branch runs: build and scan, nothing is published.
  # ---------------------------------------------------------------------------------------
  pr-build:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin
            context: .   # repo root: the admin image also builds the Schrijfassistent frontend
            dockerfile: ./admin/Dockerfile
          - name: schrijfassistent-api
            context: ./schrijfassistent/backend
            dockerfile: ./schrijfassistent/backend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: check-${{ matrix.name }}:${{ github.run_id }}

      - name: Trivy scan (fail on fixable CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2 image --exit-code 1 --severity CRITICAL --ignore-unfixed \
            "check-${{ matrix.name }}:${{ github.run_id }}"

  # ---------------------------------------------------------------------------------------
  # Version tags: guard rails before anything is built.
  # ---------------------------------------------------------------------------------------
  verify-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      semver: ${{ steps.check.outputs.semver }}
      environment: ${{ steps.check.outputs.environment }}
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag format, branch and latest
        id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points to a commit that is not on main"
            exit 1
          fi
          HIGHEST=$(git tag -l 'v*.*.*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          LATEST=false
          [ "$TAG" = "$HIGHEST" ] && LATEST=true
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "semver=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "environment=dev" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Release $TAG -> dev (latest: $LATEST)"

  # ---------------------------------------------------------------------------------------
  # Promotion tags acc/vX.Y.Z and prod/vX.Y.Z: nothing is built. Checks that the release
  # vX.Y.Z exists for the same commit and that every image is on ghcr.io, then hands the
  # version to notify-ado with environment acc or prod.
  # ---------------------------------------------------------------------------------------
  promote:
    if: startsWith(github.ref, 'refs/tags/acc/') || startsWith(github.ref, 'refs/tags/prod/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      semver: ${{ steps.check.outputs.semver }}
      environment: ${{ steps.check.outputs.environment }}
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check promotion tag, release and images
        id: check
        env:
          # Keep in sync with the matrix of release.
          IMAGES: admin schrijfassistent-api
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^(acc|prod)/(v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            echo "::error::Tag '$TAG' is not of the form acc/vX.Y.Z or prod/vX.Y.Z"
            exit 1
          fi
          ENVIRONMENT="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"

          # The release tag must exist and point at the same commit: what is promoted is
          # exactly what was built and ran on dev.
          if ! git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Release tag $VERSION does not exist; tag vX.Y.Z first (that builds and goes to dev)"
            exit 1
          fi
          if [ "$(git rev-list -n1 "$VERSION")" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG must point at the same commit as $VERSION ($(git rev-list -n1 "$VERSION"))"
            exit 1
          fi
          # prod only after acc.
          if [ "$ENVIRONMENT" = prod ] && ! git rev-parse -q --verify "refs/tags/acc/$VERSION" > /dev/null; then
            echo "::error::acc/$VERSION does not exist; promote to acc before prod"
            exit 1
          fi

          for NAME in $IMAGES; do
            IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}-${NAME}:${VERSION}"
            if ! docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
              echo "::error::$IMAGE is not on ghcr.io; did the release run for $VERSION succeed?"
              exit 1
            fi
            echo "found $IMAGE"
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "Promote $VERSION -> $ENVIRONMENT"

  # ---------------------------------------------------------------------------------------
  # Version tags: build once and publish to ghcr.io.
  # ---------------------------------------------------------------------------------------
  release:
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin
            context: .   # repo root: the admin image also builds the Schrijfassistent frontend
            dockerfile: ./admin/Dockerfile
          # Keep in sync with the pr-build matrix above.
          - name: schrijfassistent-api
            context: ./schrijfassistent/backend
            dockerfile: ./schrijfassistent/backend/Dockerfile
    env:
      VERSION: ${{ needs.verify-tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing version
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists; versions are built only once. Create a new tag instead."
            exit 1
          fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ needs.verify-tag.outputs.latest == 'true' }}

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            GIT_COMMIT=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }} ${VERSION}"
            echo ""
            echo "- Image: \`${IMAGE}:${VERSION}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------
  # Tell Azure DevOps to roll out a version: after every image was pushed (vX.Y.Z -> dev), or
  # after a successful promote check (acc/vX.Y.Z -> acc, prod/vX.Y.Z -> prod).
  # Sends {"tag":"vX.Y.Z","version":"X.Y.Z","environment":"dev|acc|prod"}
  # to the incoming webhook 'gh-schrijfassistent-webhook'
  # (service connection 'sc-schrijfassistent-webhook'), signed with X-Hub-Signature
  # (HMAC-SHA1 of the body with the repo secret ADO_WEBHOOK_SECRET). One call per release for
  # all images: ADO rolls out the admin and the backend Container App to the same tag.
  # 'needs: release' waits for every matrix entry of release; if any image fails (or the
  # version already existed), this job is skipped, so ADO never gets a half-built release.
  # Never runs for pull requests.
  # ---------------------------------------------------------------------------------------
  notify-ado:
    needs: [verify-tag, release, promote]
    # A tag run takes one of two paths: verify-tag + release (vX.Y.Z) or promote (acc/, prod/).
    # The jobs of the other path are skipped, hence !cancelled() instead of the default success().
    if: >-
      !cancelled() &&
      (needs.release.result == 'success' || needs.promote.result == 'success')
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ needs.verify-tag.outputs.version || needs.promote.outputs.version }}
      SEMVER: ${{ needs.verify-tag.outputs.semver || needs.promote.outputs.semver }}
      ENVIRONMENT: ${{ needs.verify-tag.outputs.environment || needs.promote.outputs.environment }}
      ADO_WEBHOOK_URL: https://dev.azure.com/flevoland/_apis/public/distributedtask/webhooks/gh-schrijfassistent-webhook?api-version=6.0-preview
      ADO_WEBHOOK_SECRET: ${{ secrets.ADO_WEBHOOK_SECRET }}
    steps:
      - name: Trigger Azure DevOps rollout for ${{ env.VERSION }} (${{ env.ENVIRONMENT }})
        run: |
          set -euo pipefail
          [ -n "$ADO_WEBHOOK_SECRET" ] || { echo "::error::Secret ADO_WEBHOOK_SECRET is not set"; exit 1; }
          BODY=$(jq -cn --arg t "$VERSION" --arg v "$SEMVER" --arg e "$ENVIRONMENT" \
            '{tag: $t, version: $v, environment: $e}')
          SIG="sha1=$(printf '%s' "$BODY" | openssl dgst -sha1 -hmac "$ADO_WEBHOOK_SECRET" | awk '{print $NF}')"
          HTTP=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$ADO_WEBHOOK_URL" \
            -H 'Content-Type: application/json' -H "X-Hub-Signature: $SIG" --data-binary "$BODY")
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::Azure DevOps webhook failed (HTTP $HTTP)"
            cat response.txt || true
            exit 1
          fi
          echo "Azure DevOps rollout triggered for $VERSION ($ENVIRONMENT): $BODY"
          echo "- Azure DevOps rollout triggered for \`$VERSION\` (environment \`$ENVIRONMENT\`)" >> "$GITHUB_STEP_SUMMARY"
